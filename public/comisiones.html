            line-height: 1.6;

            font-weight: 900;
        }
        
        h2 {
            font-size: clamp(24px, 6vw, 32px) !important;

            font-weight: 900;
        }
        
        p {
            font-size: clamp(14px, 2.5vw, 16px);
            line-height: 1.6;
        }
        
        button {
            min-height: 44px;
            font-size: clamp(12px, 2vw, 14px);
            padding: clamp(12px, 3vw, 16px) clamp(20px, 5vw, 32px);
        }

        nav a { color: #4b5563; font-weight: 500; font-size: 14px; transition: all 0.3s ease; text-decoration: none; }
        nav a:hover { color: #1e40af; }
        nav a.text-blue-700 { color: #1e40af; font-weight: 700; border-bottom: 2px solid #1e40af; padding-bottom: 8px; }

        button.bg-blue-700 { background-color: #1e40af; color: white; border: none; cursor: pointer; transition: all 0.3s ease; }

        @media (max-width: 768px) { a, button { min-height: 44px; min-width: 44px; } }
        
        /* Estilos específicos para Comisiones */
        .commission-card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            transition: all 0.25s ease;
            border: 1px solid rgba(226, 232, 240, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        
        .commission-card:hover {
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.12);
            transform: translateY(-4px);
        }
        
        .commission-photo {
            width: 100%;
            padding: 32px 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }
        
        .commission-photo-placeholder {
            width: 94px;
            height: 94px;
            border-radius: 999px;
            background: #e0e7ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #1d4ed8;
            box-shadow: inset 0 0 0 1px rgba(29, 78, 216, 0.12);
        }
        
        .commission-content {
            padding: 24px 20px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
        }
        
        .commission-name {
            font-size: 20px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 0;
            font-family: 'Public Sans', sans-serif;
        }
        
        .commission-title {
            font-size: 14px;
            font-weight: 600;
            color: #1d4ed8;
            text-transform: none;
            letter-spacing: 0.01em;
            margin-bottom: 16px;
        }
        
        .commission-contact-link,
        .commission-whatsapp-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border-radius: 999px;
            padding: 9px 14px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            transition: background 0.2s ease, transform 0.2s ease;
            min-height: 40px;
        }
        
        .commission-contact-link {
            background: #eff6ff;
            color: #1d4ed8;
        }
        
        .commission-whatsapp-link {
            background: #25d366;
            color: white;
        }
        
        .commission-contact-link:hover,
        .commission-whatsapp-link:hover {
            transform: translateY(-1px);
        }
        
        .commission-contact-link:hover {
            background: #dbeafe;
        }
        
        .commission-whatsapp-link:hover {
            background: #128c7e;
        }
        
        .commission-contact-link .material-icons,
        .commission-whatsapp-link .material-icons {
            font-size: 18px;
            line-height: 1;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 13px;
            color: #424751;
        }
        
        .contact-item:last-child {
            margin-bottom: 0;
        }
        
        .contact-icon {
            width: 24px;
            height: 24px;
            background: #00346f;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            flex-shrink: 0;
        }
        
        .contact-text {
            flex: 1;
            word-break: break-word;
        }
        
        .contact-text a {
            color: #1e40af;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        
        .contact-text a:hover {
            color: #00346f;
        }
        
        
        .commissions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 28px;
            margin-bottom: 64px;
        }
        
        .filter-section {
            background: white;
            padding: 40px 24px;
            border-radius: 0;
            border: none;
            margin-bottom: 40px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.3s ease;
            overflow: auto;
            padding: 20px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: white;
            border-radius: 12px;
            width: 100%;
            max-width: 1000px;
            max-height: 85vh;
            overflow-y: auto;
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 0;
            animation: slideUp 0.3s ease;
            box-shadow: 0 20px 60px rgba(0, 52, 111, 0.2);
            position: relative;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .modal-left {
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8faff 0%, #f0f5fc 100%);
            border-right: 1px solid #e5e7eb;
        }
        
        .modal-left .profile-photo {
            width: 220px;
            height: 220px;
            background: #dde5f4;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
            font-size: 100px;
            box-shadow: 0 8px 24px rgba(0, 52, 111, 0.12);
        }
        
        .modal-left-company {
            width: 100%;
            text-align: center;
        }
        
        .modal-left-company h4 {
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 12px;
        }
        
        .modal-left-company p {
            font-size: 14px;
            color: #424751;
            line-height: 1.6;
        }
        
        .modal-right {
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .modal-header {
            margin-bottom: 40px;
        }
        
        .modal-name {
            font-size: 32px;
            font-weight: 800;
            color: #00346f;
            margin-bottom: 12px;
            font-family: 'Public Sans', sans-serif;
        }
        
        .modal-title {
            font-size: 13px;
            font-weight: 700;
            color: #1e40af;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e5e7eb;
        }
        
        .modal-info {
            margin-bottom: 40px;
        }
        
        .modal-info-item {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 18px;
            font-size: 14px;
            color: #424751;
        }
        
        .modal-info-item:last-child {
            margin-bottom: 0;
        }
        
        .modal-info-icon {
            width: 32px;
            height: 32px;
            background: #00346f;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            flex-shrink: 0;
        }
        
        .modal-info-text {
            flex: 1;
        }
        
        .modal-info-text a {
            color: #1e40af;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }
        
        .modal-info-text a:hover {
            color: #00346f;
        }
        
        .modal-description {
            color: #6b7280;
            line-height: 1.8;
            font-size: 14px;
            background: #f9f9fc;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #1e40af;
        }
        
        .modal-close {
            position: absolute;
            right: 20px;
            top: 20px;
            background: white;
            border: 2px solid #e5e7eb;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            color: #6b7280;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 300;
            line-height: 1;
        }
        
        .modal-close:hover {
            background: #f5f7fb;
            border-color: #00346f;
            color: #00346f;
            transform: scale(1.1);
        }
